<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeamento de Rede</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rede.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌐 Mapeamento de Rede</h1>
            <p class="subtitle">Executa a descoberta na hora — nada é salvo, só o resultado da última execução.</p>
        </header>

        <section class="scan-panel">
            <label for="network-cidr">Rede (CIDR)</label>
            <div class="scan-controls">
                <input type="text" id="network-cidr" value="{{ default_network }}" placeholder="192.168.1.0/24">
                <button id="btn-scan" class="btn-primary">▶ Executar Mapeamento</button>
            </div>
            <div id="status-line" class="status-line"></div>
        </section>

        <section id="result-panel" class="result-panel" style="display:none;">
            <div class="result-summary" id="result-summary"></div>
            <div id="warnings" class="warnings"></div>
            <div id="tree-container" class="tree-container"></div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/rede.js') }}"></script>
</body>
</html>
