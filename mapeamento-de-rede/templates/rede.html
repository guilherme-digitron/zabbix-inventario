<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapa de Rede</title>
  <link rel="stylesheet" href="{{ url_for('rede.static', filename='css/rede.css') }}">
  <!-- Usamos CDN para Cytoscape como fallback rápido; para uso offline baixe em mapeamento-de-rede/static/js/cytoscape.min.js -->
  <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  <script src="{{ url_for('rede.static', filename='js/rede.js') }}" defer></script>
</head>
<body>
  <header>
    <h1>Mapeamento de Rede</h1>
    <div id="controls">
      <button id="btn-discover">Atualizar mapa</button>
      <select id="auto-refresh">
        <option value="0">Desativado</option>
        <option value="60">1 minuto</option>
        <option value="300">5 minutos</option>
        <option value="900">15 minutos</option>
      </select>
      <span id="status">Pronto</span>
    </div>
  </header>
  <main>
    <div id="cy"></div>
    <aside id="panel">
      <h2>Detalhes</h2>
      <div id="details">Selecione um nó</div>
    </aside>
  </main>
</body>
</html>
